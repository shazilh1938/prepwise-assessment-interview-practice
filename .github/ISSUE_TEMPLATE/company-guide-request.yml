name: Company or programme guide request
description: Suggest a company, graduate programme or internship guide for public evidence review.
title: "[Guide request] "
body:
  - type: input
    id: programme
    attributes:
      label: Company and programme
      placeholder: Company Graduate Programme 2027
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country or region
      placeholder: Global, EMEA, Italy, United Kingdom
    validations:
      required: true
  - type: input
    id: official
    attributes:
      label: Official application page
      placeholder: https://
  - type: textarea
    id: need
    attributes:
      label: What preparation would be useful?
      placeholder: One-way interview, cognitive assessment, motivation questions...
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Content check
      options:
        - label: This request does not contain live test questions, personal data or confidential material.
          required: true
