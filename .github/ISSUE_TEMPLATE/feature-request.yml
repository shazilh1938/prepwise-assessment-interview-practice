name: Candidate preparation improvement
description: Suggest a product or public-resource improvement.
title: "[Improvement] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Game-based assessment practice
        - One-way video interview
        - General interview coach
        - Progress and history
        - Company guides
        - Accessibility or usability
        - Other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What made the preparation difficult?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal data, CV content and answer transcripts from this public request.
          required: true
